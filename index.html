<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="面向 SRE 的开源脚本目录，先读源码，再安全执行。">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f5f5">
    <title>Awesome Script Hub</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" media="(prefers-color-scheme: light)" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" media="(prefers-color-scheme: dark)" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script defer src="router.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="#/" aria-label="Awesome Script Hub 首页">
          <span class="brand-mark" aria-hidden="true">&gt;_</span>
          <span>Awesome Script Hub</span>
        </a>
        <nav class="header-actions" aria-label="站点导航">
          <a class="is-active" href="#/">脚本库</a>
          <a href="https://github.com/" target="_blank" rel="noopener noreferrer">代码仓库</a>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换颜色主题" title="切换颜色主题"><span aria-hidden="true">◐</span></button>
        </nav>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      <div class="loading-page shell" id="app" aria-live="polite">
        <div class="loading-mark" aria-hidden="true"></div>
        <p>正在加载脚本索引…</p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>Awesome Script Hub</span>
        <span>静态托管 · Runtime Markdown · No backend</span>
      </div>
    </footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
